[package]
name = "ctx-delta-relay"
version = "0.1.0"
edition = "2024"
description = "Dual-end transparent LLM context delta + zstd relay with byte-bounded in-memory LRU and automatic fallback"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["http1", "http2"] }
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.2"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
zstd-safe = { version = "7.2", features = ["std"] }

[dev-dependencies]
tokio-stream = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
